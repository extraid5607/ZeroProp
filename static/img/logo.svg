<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Deep Obsidian Glass Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyber Rim -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.9" />
    </linearGradient>

    <!-- Top Wing Gradient -->
    <linearGradient id="top-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Diagonal Breakout Surge Ribbon -->
    <linearGradient id="surge-diag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="40%" stop-color="#00F2FE" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Bottom Base Wing -->
    <linearGradient id="bot-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Shimmer Highlight -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Flare Radial Glow -->
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="inner-ambient" cx="75%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="spark-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Outer Shadow Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#000" opacity="0.4" filter="url(#neon-glow)" />

  <!-- Main Rounded Hex/Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="2.4" />
  
  <!-- Subtle Ambient Radial Glow inside -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#inner-ambient)" />

  <!-- Subtle Chart Gridlines Accent in Background -->
  <g opacity="0.13" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="22" y1="40" x2="98" y2="40" />
    <line x1="22" y1="60" x2="98" y2="60" />
    <line x1="22" y1="80" x2="98" y2="80" />
    <line x1="42" y1="20" x2="42" y2="100" />
    <line x1="62" y1="20" x2="62" y2="100" />
    <line x1="82" y1="20" x2="82" y2="100" />
  </g>

  <!-- Ambient Surge Glow behind Z -->
  <path d="M30 34 H88 L34 86 H92" fill="none" stroke="url(#surge-diag)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#neon-glow)" />

  <!-- === 3D Faceted "Z" Monogram === -->

  <!-- 1. Bottom Wing Base -->
  <path d="M36 86 H88 C91.3 86 94 83.3 94 80 C94 77.2 92.2 74.8 89.5 74.2 L48 74.2 L82 40 L68 40 L34 78 C32.5 79.8 32.8 82.5 34.5 84.5 C34.9 85.5 35.4 86 36 86 Z" fill="url(#bot-wing)" />
  <path d="M36 86 H88 C91.3 86 94 83.3 94 80 L88 74.2 L48 74.2 L36 86 Z" fill="#00F0FF" opacity="0.25" />

  <!-- 2. Central Breakout Dynamic Surge Ribbon (Ascending) -->
  <path d="M38 82 L78 36 L66 36 L26 82 Z" fill="url(#surge-diag)" opacity="0.4" />
  <path d="M42 84 L88 32 C90.5 29.2 89.8 25 86.5 24 C85.5 23.7 84.5 23.8 83.5 24.2 L74 28 L32 76 C30.2 78 30.5 81.2 32.5 83.2 C34.5 85.2 38.5 85.8 42 84 Z" fill="url(#surge-diag)" filter="url(#neon-glow)" />

  <!-- 3. Top Wing (Sharp Horizon Apex) -->
  <path d="M28 32 C26.3 32 25 33.3 25 35 C25 36.7 26.3 38 28 38 H76 L86 26 H34 C30.7 26 28 28.7 28 32 Z" fill="url(#top-wing)" />
  
  <!-- Specular Sheen on Top Edge -->
  <path d="M34 26 H86 L80 30 H34 C31.8 30 30 28.2 30 26 Z" fill="url(#shimmer)" />

  <!-- 4. Bullish Candlestick / Breakout Apex Needle -->
  <line x1="88" y1="18" x2="88" y2="34" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" filter="url(#neon-glow)" />
  <rect x="85.5" y="22" width="5" height="9" rx="1.5" fill="#4ADE80" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- 5. Brilliant Radiant Starburst / Diamond at Peak of Breakout -->
  <circle cx="88" cy="22" r="10" fill="url(#spark-glow)" filter="url(#spark-blur)" />
  <path d="M88 13 L90 20 L97 22 L90 24 L88 31 L86 24 L79 22 L86 20 Z" fill="#FFFFFF" filter="url(#neon-glow)" />
  <circle cx="88" cy="22" r="2.2" fill="#FFFFFF" />

  <!-- Lower Left Accent Micro-Dot (Foundation indicator) -->
  <circle cx="28" cy="84" r="2.2" fill="#8B5CF6" />
</svg>
