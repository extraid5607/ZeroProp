<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZeroProp: Professional Trading Simulator & Evaluation</title>
  <meta name="description" content="Trade crypto, forex, gold, silver and crude oil with $10,000 of virtual funds on live real-time prices with ZeroProp. Master risk management and evaluation rules.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101a2d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZeroProp">
  
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="alternate icon" type="image/png" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
  <script src="/vendor/lightweight-charts.standalone.production.js" defer></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('PWA service worker registration failed:', err);
        });
      });
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">ZeroProp needs JavaScript to show live prices and charts. Turn it on and reload.</p></noscript>
</body>
</html>
